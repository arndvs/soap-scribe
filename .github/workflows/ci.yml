name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      # Runs the MongoDB repository contract tests against a throwaway database.
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Forbidden files
        run: pnpm check:files
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  e2e:
    # The built extension in Chromium against demo mode: fake Pocket, fake Jane,
    # rule-based stand-in model, real API/worker/pipeline. See docs/demo.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soap-scribe/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7

  image:
    # The deploy workflow pushes this image; building it on every push catches a
    # broken Dockerfile before a deploy does. Nothing is pushed from here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the API/worker image
        run: docker build -f deploy/Dockerfile -t soap-scribe:ci .
      - name: The image starts and stops on missing configuration
        run: |
          out=$(docker run --rm soap-scribe:ci node dist/api.js 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "MONGODB_URI"
